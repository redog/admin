<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 240px;
    padding: 16px;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    color: #1a1a1a;
    margin: 0;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: #666;
    font-size: 12px;
    margin: 0 0 16px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
  }
  .toggle-label {
    font-weight: 500;
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 22px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  input:checked + .slider {
    background: #4a90d9;
  }
  input:checked + .slider::before {
    transform: translateX(18px);
  }
  .demo {
    margin-top: 12px;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 6px;
    font-size: 13px;
    color: #444;
    text-align: center;
  }
  .demo .arrow {
    margin: 0 6px;
    color: #999;
  }
</style>
</head>
<body>
  <h1>Sarcasterisk</h1>
  <p class="subtitle">/s &rarr; ⁂</p>
  <div class="toggle-row">
    <span class="toggle-label">Enabled</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="demo">
    <span>wow, great job /s</span>
    <br>
    <span>wow, great job ⁂</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
